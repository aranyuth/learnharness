[package]
name = "learnharness-core"
version = "0.2.0"
edition = "2021"
authors = ["LearnHarness Authors"]
description = "High-performance Socratic Epistemic Engine and KGLite Storage in Rust"

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["sync", "macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"
